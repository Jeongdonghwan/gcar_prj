{% extends 'base.html' %}
{% block title %}개인정보 처리방침 — Great Car{% endblock %}
{% block content %}
<div class="container" style="padding:24px 0;max-width:720px;">
  <h1 style="font-size:24px;">개인정보 처리방침</h1>
  <p style="color:var(--ink-2);margin-top:16px;line-height:1.7;">
    Great Car는 회원의 이메일·이름·휴대전화 번호를 회원관리·고객 문의 응대 목적으로만 사용합니다.
    카카오 로그인 사용 시 카카오에서 제공하는 식별자(kakao_id), 이메일, 닉네임을 보관합니다.
    수집된 정보는 회원 탈퇴 시 즉시 파기됩니다.
  </p>
</div>
{% endblock %}
