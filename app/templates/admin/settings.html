{% extends 'admin/admin_base.html' %}
{% block crumb %}설정{% endblock %}
{% block page_title %}사이트 설정{% endblock %}
{% block content %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <fieldset class="form-set">
    <legend>고객센터</legend>
    <div class="form-grid">
      <div class="form-field">
        <label>고객센터 전화번호</label>
        <input type="tel" name="contact_phone" value="{{ contact_phone }}" placeholder="000-0000-0000" />
        <p style="margin-top:6px;color:var(--muted);font-size:12px;">모든 공개 페이지의 플로팅 버튼·푸터·상담 CTA에 이 번호가 표시됩니다. 수시로 변경할 수 있습니다.</p>
      </div>
      <div class="form-field">
        <label>상담 시간 문구</label>
        <input type="text" name="contact_hours" value="{{ contact_hours }}" placeholder="24시간 상담 가능" />
        <p style="margin-top:6px;color:var(--muted);font-size:12px;">전화번호 옆에 함께 표시되는 문구입니다. (예: 24시간 상담 가능)</p>
      </div>
    </div>
  </fieldset>
  <div class="form-actions">
    <div></div>
    <button class="btn btn-primary" type="submit">저장</button>
  </div>
</form>
{% endblock %}
